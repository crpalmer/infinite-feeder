<!doctype html>
<html>
  <head>
    <Title>Infinite Feeder</title>
    <link rel="stylesheet" href="infinite-feeder.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.7/dist/cdn.min.js" defer></script>
    <script src="http://unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <form x-target="lane1-form" id="lane1-form" method="POST" action="?data=lane1&" x-data="@@LANE1_DATA@@"/>
      <div>
        <label for="i1">Text: </label><input type="text" id="i1" name="i1" width=20" x-model="i1"/>
      </div>
      <div>
        <label for="i2">Number:</label><input type="number" id="i2" name="i2" width=8" x-model="i2"/>
      </div>
      <button type="submit">Save</button>
    </form>
  </div>
  </body>
</html>

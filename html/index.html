<!doctype html>
<html>
  <head>
    <Title>Infinite Feeder</title>
    <link rel="stylesheet" href="infinite-feeder.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.7/dist/cdn.min.js" defer></script>
    <script src="http://unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <nav class="tab-container">
      <ul class="tab-row">
	<li class="tab tab-active">Status</li>
	<li class="tab tab-inactive"><a href="config.html">Configuration</a></li>
      </ul>
    </nav>
    <table>
      <tr><th class="status-label"/><th class="status-cell">Lane 1</th><th class="status-cell">Lane 2</th></tr>
      <tr>
	<td class="status-label">Buffer Status:</td>
	<td class="status-cell" x-data="{ full: @@buffer_full@@, empty : @@buffer_empty@@ }" colspan="2" >
	  <span x-text="full && empty ? 'full & empty??' : full ? 'full' : empty ? 'empty' : 'partially fed'"></span>
	</td>
      </tr>
      <tr><td class="status-label">Current State:</td><td class="status-cell">@@lane1_state@@</td><td class="status-cell">@@lane2_state@@</td></tr>
      <tr>
	<td class="status-label">Filament Status:</td>
	<td class="status-cell" x-data="{ present: @@lane1_present@@, loaded : @@lane1_loaded@@ }" >
	  <span x-text="present && loaded ? 'present & loaded' : present ? 'present' : loaded ? 'loaded' : 'empty'"></span>
	</td>
	<td class="status-cell" x-data="{ present: @@lane2_present@@, loaded : @@lane2_loaded@@ }" >
	  <span x-text="present && loaded ? 'present & loaded' : present ? 'present' : loaded ? 'loaded' : 'empty'"></span>
	</td>
      </tr>
      <tr><td class="status-label">Filament fed (mm):</td><td class="status-cell">@@lane1_mm@@</td><td class="status-cell">@@lane2_mm@@</td></tr>
    </table>
  </body>
</html>
